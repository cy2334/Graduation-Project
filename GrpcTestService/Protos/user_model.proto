syntax = "proto3";

package user;
option csharp_namespace = "My.GRPC.Demo";

message LoginRequest{
  string user_name = 1;
  string password = 2;
}

message LoginResponse{
  string token = 1;
}
message RegisterRequest{
  string user_name = 1;
  string Email = 2;
  string Password = 3;
}
message RegisterResponse{
  string status = 1;
}
message VIPRegisterRequest{
  string VIPpassword = 1;
  string name = 2;
}
message VIPRegisterResponse{
  string status =1;
}